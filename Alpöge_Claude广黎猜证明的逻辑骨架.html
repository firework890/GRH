<svg width="100%" viewBox="0 0 680 512" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Alpöge–Claude 证明的逻辑骨架</title>
<desc>四步链条：把黎曼猜想归约为素数幂和的一侧估计，用同一协体积的算术上界与几何下界夹逼，主项相消得到 1/m 增益，最后用 Landau 引理和函数方程推出广义黎曼猜想。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g>
<rect x="70" y="20" width="540" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">① 先把问题压成一个「单侧」估计</text>
<text x="340" y="61" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">只需证 R(x) ≤ x^(β−1)，β 可任意接近 1/2</text>
</g>
<path d="M340 76 L340 112" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="190" y="120" width="300" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="142" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">② 同一个量，两头夹</text>
<text x="340" y="161" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">θ-提升族的平方协体积</text>
</g>
<path d="M265 176 L185 208" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M415 176 L495 208" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="40" y="216" width="270" height="76" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="175" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">上界：算术侧</text>
<text x="175" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">整除性 · 指标 · Galois 表示</text>
<text x="175" y="275" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Eisenstein 同余 · Selmer 界</text>
</g>
<g>
<rect x="370" y="216" width="270" height="76" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="505" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">下界：几何侧</text>
<text x="505" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Bost 斜率不等式</text>
<text x="505" y="275" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Gram 行列式 ≥ 0（正性）</text>
</g>
<path d="M175 292 L295 330" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M505 292 L385 330" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="140" y="336" width="400" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="358" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">③ 主项相消 → mR ≤ 误差，取 m ≈ √x</text>
<text x="340" y="377" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">换来 1/m ≈ x^(−1/2) 的增益，这是全篇关键</text>
</g>
<path d="M340 392 L340 428" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="50" y="436" width="580" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="458" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">④ R(x) ≪ x^(−1/2+ε)，再用 Landau 引理收尾</text>
<text x="340" y="477" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">半平面无零点 ＋ 函数方程 ⇒ 零点全在 Re s = 1/2</text>
</g>
</svg>
